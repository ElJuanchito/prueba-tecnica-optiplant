# Perfil por defecto: local y dentro de Compose.
optiplant:
  jwt:
    # Valor de desarrollo, y está marcado como tal a propósito: si aparece en
    # cualquier otro entorno, se reconoce de un vistazo. En prod no hay valor por defecto.
    secret: ${JWT_SECRET:clave-de-desarrollo-no-usar-fuera-de-local-256-bits-minimo}
  cors:
    # frontend/ todavía no existe; estos son los puertos habituales de Vite/CRA en
    # local. Sin comodín — un origen explícito por entrada (RNF-SEC-06).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  analytics:
    external:
      # Clave de API para CU-EXT-01 (consulta de disponibilidad consolidada). Valor de
      # desarrollo, marcado como tal. user-external-id apunta al usuario semilla
      # 'operador.bogota' (02-seed-data.sql): la petición externa se resuelve a ese sujeto.
      api-keys:
        - key: ${ANALYTICS_EXTERNAL_API_KEY:dev-external-availability-api-key-32chars}
          user-external-id: e0000000-0000-0000-0000-000000000005

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.optiplant.inventory: DEBUG
