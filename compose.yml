services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optiplant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optiplant}
    volumes:
      # DT-01: mientras este montaje exista, Flyway permanece apagado.
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    # Sin `ports`: la base sólo es alcanzable como `db:5432` desde la red de
    # Compose. Para abrirla en el anfitrión (backend nativo, psql, un cliente
    # gráfico) está `compose.dev.yml`.
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-optiplant} -h localhost || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-optiplant}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-optiplant}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      # El navegador manda `Origin: http://localhost:${FRONTEND_PORT}` y el backend
      # rechaza con 403 «Invalid CORS request» cualquier origen fuera de esta lista.
      # El default de application-dev.yml apunta al servidor de Vite (5173), no al
      # Nginx del compose, así que aquí se declara el origen real de esta topología.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081}}
      # Sin `=`: se propaga sólo si está definida en el entorno. Con un valor por
      # defecto vacío sobrescribiría el de application-dev.yml y @NotBlank fallaría.
      - JWT_SECRET
    # Sin `ports`: la API se consume por el proxy `/api` de Nginx, que la alcanza
    # como `backend:8080` dentro de la red de Compose. Publicarla en el anfitrión
    # abriría una segunda puerta de entrada, con otro origen y sin el proxy.
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${BACKEND_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    environment:
      # Upstream del proxy `/api` de Nginx dentro de la red de Compose. El
      # backend escucha en BACKEND_PORT; Nginx resuelve el nombre en cada request
      # (resolver 127.0.0.11), así que no necesita esperar a que esté sano.
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8080}
    ports:
      # Único puerto publicado de la solución: Nginx es la entrada al sistema y
      # sirve la SPA y `/api` bajo un mismo origen. Escucha 8080 dentro del
      # contenedor y se publica en 8081 para no chocar con un backend nativo.
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 y no `localhost`: Nginx sólo escucha IPv4 y el wget de BusyBox
      # no reintenta si `localhost` resuelve primero a ::1.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
